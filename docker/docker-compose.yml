services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa_password
      POSTGRES_DB: document_qa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d document_qa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://docqa:docqa_password@postgres:5432/document_qa_db
      SECRET_KEY: change-this-secret-key-in-production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2:7b
      UPLOAD_DIR: /app/uploads
      EMBEDDING_DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - ../uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
